<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tide — a calm to‑do list</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="ocean"></div>

<main class="app">
  <header class="app-header">
    <h1>Tide</h1>
    <p class="tagline">Small tasks, cleared out one at a time.</p>
  </header>

  <form id="add-form" class="add-form" autocomplete="off">
    <input
      type="text"
      id="task-input"
      placeholder="What needs doing?"
      maxlength="200"
      required
    >
    <button type="submit" class="btn-add" aria-label="Add task">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M9 2V16M2 9H16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Add
    </button>
  </form>

  <div class="toolbar">
    <div class="filters" role="tablist" aria-label="Filter tasks">
      <button class="filter-btn is-active" data-filter="all" role="tab" aria-selected="true">All</button>
      <button class="filter-btn" data-filter="active" role="tab" aria-selected="false">Active</button>
      <button class="filter-btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
    </div>
    <button id="clear-completed" class="link-btn">Clear completed</button>
  </div>

  <ul id="task-list" class="task-list"></ul>

  <p id="empty-state" class="empty-state" hidden>The tide is out. Nothing left to do.</p>

  <footer class="app-footer">
    <span id="task-count">0 tasks left</span>
  </footer>
</main>

<script src="script.js"></script>
</body>
</html>
